<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semestre 1</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e1e, #3a3a3a);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative; 
        }

        /* Bouton retour placé en haut à gauche */
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 30px;
            background: transparent;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .back-button:hover {
            background: white;
            color: #1e1e1e;
            transform: scale(1.05);
        }

        /* Encadré Glassmorphism */
        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            max-width: 900px; /* Un peu plus large pour que les boutons soient bien côte à côte */
            width: 100%;
            margin-top: 50px; 
        }

        h1 {
            font-size: 3.5rem;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Séparateur élégant sous le titre */
        h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: white;
            margin: 25px auto 40px auto;
            border-radius: 2px;
            opacity: 0.5;
        }

        /* Grille pour les boutons (alignement horizontal intelligent) */
        .menu-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .menu-grid a {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px 20px;
            width: calc(50% - 10px); /* Crée 2 colonnes parfaitement espacées */
            min-width: 280px; /* Empêche les boutons d'être trop petits */
            box-sizing: border-box;
            
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            
            color: white;
            text-decoration: none;
            transition: 0.4s;
            text-align: center;
        }

        .menu-grid a:hover {
            background: white;
            color: #1e1e1e;
            border-color: white;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
        }

        .mission-number {
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .mission-title {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* Adaptation pour petits écrans de téléphone */
        @media (max-width: 700px) {
            .menu-grid a {
                width: 100%; /* Repasse sur 1 seule colonne sur mobile */
            }
            .back-button {
                top: 15px;
                left: 15px;
                font-size: 0.75rem;
                padding: 8px 15px;
            }
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Bouton retour (transformé en vrai lien) -->
    <a class="back-button" href="menu_semestres.html">← Retour aux semestres</a>

    <div class="container">
        <h1>Semestre 1</h1>

        <div class="menu-grid">
            <a href="Mission_1.html">
                <span class="mission-number">Mission 1</span>
                <span class="mission-title">Diverses activités professionnelles</span>
            </a>
            <a href="Mission_2.html">
                <span class="mission-number">Mission 2</span>
                <span class="mission-title">Appel d'offres</span>
            </a>
            <a href="Mission_3.html">
                <span class="mission-number">Mission 3</span>
                <span class="mission-title">Mise en réseau d'une salle</span>
            </a>
            <a href="Mission_4.html">
                <span class="mission-number">Mission 4</span>
                <span class="mission-title">Réalisation d'un site web</span>
            </a>
        </div>
    </div>

</body>
</html>
