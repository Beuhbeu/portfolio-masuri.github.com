<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Semestre 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e1e, #3a3a3a);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: row; /* Alignement horizontal */
            justify-content: center;
            gap: 30px; /* Espace entre les boutons */
        }

        button {
            padding: 15px 35px;
            font-size: 1.2em;
            cursor: pointer;
            border: 2px solid white;
            border-radius: 8px;
            background-color: transparent;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Semestre 1</h1>

    <div class="buttons">
        <button onclick="location.href='mission_1.html'">Mission 1</button>
        <button onclick="location.href='mission_2.html'">Mission 2</button>
        <button onclick="location.href='mission_3.html'">Mission 3</button>
        <button onclick="location.href='mission_4.html'">Mission 4</button>
    </div>

</body>
</html>
