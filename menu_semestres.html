<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Choix du semestre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e1e, #3a3a3a);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        /* Sous-texte ajouté */
        .subtitle {
            font-size: 1.2em;
            opacity: 0.85;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: row; /* Alignement horizontal */
            justify-content: center;
            gap: 40px; /* Espace entre les boutons */
        }

        button {
            padding: 15px 35px;
            font-size: 1.2em;
            cursor: pointer;
            border: 2px solid white;
            border-radius: 8px;
            background-color: transparent;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>

    <h1>Choisissez un semestre</h1>

    <div class="subtitle">Sélectionnez le semestre que vous souhaitez consulter</div>

    <div class="buttons">
        <button onclick="location.href='semestre1.html'">Semestre 1</button>
        <button onclick="location.href='semestre2.html'">Semestre 2</button>
    </div>

</body>
</html>
