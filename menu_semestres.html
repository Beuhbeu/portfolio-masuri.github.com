<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Choix du semestre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e1e, #3a3a3a);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Bouton retour */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 8px;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: 0.3s;
        }

        .back-button:hover {
            background: white;
            color: black;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.85;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 40px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2em;
            cursor: pointer;
            border: 2px solid white;
            border-radius: 8px;
            background-color: transparent;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>

    <!-- Bouton retour -->
    <button class="back-button" onclick="location.href='index.html'">← Retour au menu</button>

    <h1>Choisissez un semestre</h1>

    <div class="subtitle">
        Les missions réalisées ont toutes été faites sous deux semestres.  
        La page "Autre" contient une mission annexe réalisée hors du cadre de ma formation récente.
    </div>

    <div class="buttons">
        <button onclick="location.href='semestre_1.html'">Semestre 1</button>
        <button onclick="location.href='semestre_2.html'">Semestre 2</button>
        <button onclick="location.href='Mission_10.html'">Autre - Capteur Piézo-électrique</button>
    </div>

</body>
</html>
