<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page avec Titre et Boutons Verticaux</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: column; /* Alignement vertical */
            align-items: center;
            gap: 20px; /* Espace entre les boutons */
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #4CAF50;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Mon Titre Centré</h1>

    <div class="buttons">
        <button>Bouton 1</button>
        <button>Bouton 2</button>
    </div>

</body>
</html>
